name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Setup Fresh Flutter App
        run: |
          mkdir backup
          cp -r lib pubspec.yaml backup/ || true
          rm -rf * .github
          flutter create . --platforms=android --org com.riyad.carrom
          cp backup/lib/main.dart lib/main.dart || true
          rm -rf backup

      - name: Add Overlay Dependency
        run: flutter pub add flutter_overlay_window:any

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: carrom-overlay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
